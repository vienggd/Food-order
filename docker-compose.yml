# Local database for development and tests. Not used in production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
